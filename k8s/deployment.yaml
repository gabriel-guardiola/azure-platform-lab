apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 2
  selector:
    matchLabels: { app: hello }
  template:
    metadata:
      labels: { app: hello }    # must match the selector above
    spec:
      containers:
        - name: hello
          image: hello-api:v1
          # Use the locally built image instead of pulling from a registry
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # Only send traffic once /health responds  
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          # Restart the container if /health stops responding   
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi